# Alembic configuration for the production PostgreSQL schema (ADR-0008).
# DuckDB applies the same DDL from infrastructure.repositories.ddl at open.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Overridden by SPC_DATABASE_URL / SPC_TEST_DATABASE_URL in env.py.
sqlalchemy.url = driver://user:pass@localhost/spc

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
