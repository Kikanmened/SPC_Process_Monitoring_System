name: Set up the project environment
description: >-
  Install uv and materialise the environment from the committed lockfile.
  Every job uses this, so no job can silently run against a different
  dependency set from the one production installs.

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    # --frozen fails if uv.lock does not match pyproject.toml, so a dependency
    # added without relocking is caught here rather than resolved on the fly
    # into an environment nobody can reproduce.
    - name: Sync the locked environment
      shell: bash
      run: uv sync --frozen --all-groups
