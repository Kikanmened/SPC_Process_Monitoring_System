        step_id: GATE_LITHO
        chart_type: xbar-r
        sample_size: 5
        frequency: every_lot
        ocap_id: OCAP-GATE-CD-ADI
        rule_set_name: western_electric_1_4

      - parameter_id: OVERLAY_X
        product_id: DEV-A
        step_id: GATE_LITHO
        chart_type: xbar-s
        sample_size: 10
        frequency: every_lot
        ocap_id: OCAP-OVERLAY
        rule_set_name: western_electric_1_4

      - parameter_id: OVERLAY_Y
