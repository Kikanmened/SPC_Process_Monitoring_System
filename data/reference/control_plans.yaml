# The control plan is the specification this platform implements.
#
# It is also the sampling authority. `sample_size` is the number of wafers
# measured per lot for that characteristic — and therefore the subgroup size on
# the chart — while `frequency` says how often the lot is sampled at all. The
# synthetic generator reads both from here rather than restating them in its own
# configuration, so a dataset cannot be sampled differently from the plan the
# platform charts it against.
#
# Recognised frequencies: every_lot, every_2nd_lot, every_5th_lot.
#
# Subgroup size follows the chart family: 1 for i-mr and c, 5 for xbar-r, and 10
# for xbar-s, which is where the sample standard deviation becomes the better
# estimator of spread than the range (Montgomery §6.3).
control_plans:
  # ======================================================================
  # DEV-A — 28 nm logic
  # ======================================================================
  - plan_id: CP-DEV-A-FEOL
    name: Device A front-end control plan
    characteristics:
      - parameter_id: OXIDE_THK
        product_id: DEV-A
        step_id: OXIDE_GROW
        chart_type: i-mr
        sample_size: 1
        frequency: every_lot
        ocap_id: OCAP-OXIDE-THK
        rule_set_name: western_electric_1_4

      - parameter_id: OXIDE_UNIF
        product_id: DEV-A
        step_id: OXIDE_GROW
        chart_type: i-mr
        sample_size: 1
        frequency: every_5th_lot
        ocap_id: OCAP-OXIDE-UNIF
        rule_set_name: western_electric_1_4

      - parameter_id: PARTICLE_COUNT
        product_id: DEV-A
        step_id: OXIDE_GROW
        chart_type: c
        sample_size: 1
        frequency: every_5th_lot
        ocap_id: OCAP-PARTICLES
        rule_set_name: shewhart_only

      - parameter_id: POLY_THK
        product_id: DEV-A
        step_id: POLY_DEP
        chart_type: xbar-s
        sample_size: 10
        frequency: every_2nd_lot
        ocap_id: OCAP-POLY-THK
