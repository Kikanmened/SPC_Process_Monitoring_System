# Specification limits with effective dates. Historical values are retained —
# overwriting destroys the ability to assess past conformance (FR-CF03).
#
# `POLY_CD` on DEV-A is the worked example of that rule: the window was tightened
# on 2025-07-01, and both the old and the new limit are here. A conformance
# statement about March must use the limit that was in force in March, and an
# auditor will ask to see it.
#
# A single-sided characteristic leaves the open side absent rather than setting a
# placeholder. Targets are plausible in magnitude and invented in substance
# (DATASET_GUIDE.md §7).
specification_limits:
