# Tool and chamber registry. A newly qualified tool is a reviewed data change.
#
# Chambers are declared because chamber mismatch within a tool is a leading
# explanation for an apparent process shift, and a measurement that cannot name
# its chamber cannot be assigned to one (DATASET_GUIDE.md §3.1). A process tool
# with no chambers listed would be a modelling error; a metrology tool with
# chambers would be the same mistake in the other direction.
#
# `chambers` entries inherit `tool_id` from their parent and must not restate it.
tools:
  # === OXIDE_GROW ==========================================================
  - tool_id: OX-01
    step_id: OXIDE_GROW
    name: Oxidation furnace 01
    is_metrology: false
    chambers:
      - chamber_id: OX-01-A
        name: Tube A
      - chamber_id: OX-01-B
        name: Tube B

  - tool_id: OX-02
    step_id: OXIDE_GROW
