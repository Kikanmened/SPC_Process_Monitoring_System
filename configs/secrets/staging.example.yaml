# Example staging secrets — copy into the site secret store.
# Never commit a filled copy (configs/secrets/* is gitignored except *.example.yaml).
#
# Map these keys to environment variables at runtime (DEPLOYMENT_PLAN.md §5):
#   db_password      → SPC_DB_PASSWORD
#   database_url     → SPC_DATABASE_URL
#   auth_mode        → SPC_AUTH_MODE  (header | proxy)

db_password: replace-me
database_url: postgresql+psycopg://spc:replace-me@db:5432/spc
auth_mode: proxy
